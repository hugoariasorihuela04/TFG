<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autenticación Facial Anti-Deepfake</title>
    <style>
      /* Minimal, neutral styles only — preserve structure and classes/IDs */
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
        background: #fafafa;
        color: #111;
        line-height: 1.4;
        padding: 24px;
      }

      .container {
        max-width: 640px;
        margin: 24px auto;
        background: #ffffff;
        color: inherit;
        border: 1px solid #e6e6e6;
        border-radius: 6px;
        padding: 20px;
      }

      h1 {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 6px;
      }

      .subtitle {
        font-size: 13px;
        color: #555;
        margin-bottom: 16px;
      }

      .video-container {
        margin: 18px 0;
        border: 1px solid #ddd;
        border-radius: 4px;
        overflow: hidden;
        background: #000;
        aspect-ratio: 4 / 3;
      }

      video { display: block; width: 100%; height: 100%; }
      canvas { display: none; }

      .button-container { display: flex; gap: 10px; margin: 14px 0; }

      button {
        flex: 1;
        padding: 10px 14px;
        font-size: 14px;
        border-radius: 4px;
        border: 1px solid #222;
        background: transparent;
        color: #222;
        cursor: pointer;
      }

      button:disabled { opacity: 0.6; cursor: not-allowed; }

      .info-box {
        background: transparent;
        border-left: none;
        padding: 8px 0;
        margin: 12px 0;
        color: #444;
        font-size: 13px;
      }

      .result-container {
        margin-top: 16px;
        padding: 12px;
        background: #fafafa;
        border: 1px solid #eee;
        border-radius: 4px;
        min-height: 72px;
      }

      pre { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, 'Roboto Mono', monospace; font-size: 13px; color: #111; white-space: pre-wrap; }

      /* Keep status color hints subtle */
      .result-container.success { border-color: #cfead5; background: #fbfffb; }
      .result-container.error   { border-color: #f1d3d3; background: #fffaf9; }
      .result-container.loading { border-color: #efe1d6; background: #fffdf8; }

      .status-message { text-align: center; color: #666; font-style: normal; }

      /* Minimal spinner (kept small and neutral) */
      .loading-spinner { width: 16px; height: 16px; border: 2px solid #ddd; border-top-color: #888; border-radius: 50%; animation: spin 1s linear infinite; display: inline-block; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔐 Autenticación Facial</h1>
      <p class="subtitle">Sistema Anti-Deepfake basado en Detección de Vivacidad</p>

      <div class="video-container">
        <video id="video" autoplay playsinline></video>
      </div>
      <canvas id="canvas"></canvas>

      <div class="button-container">
        <button id="auth-btn">🎥 Autenticar</button>
      </div>

      <div class="info-box">
        ℹ️ Asegúrate de que tu cara esté completamente visible en la cámara para una mejor detección.
      </div>

      <div class="result-container">
        <pre id="result" class="status-message">Esperando autenticación...</pre>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
