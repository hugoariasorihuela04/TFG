<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autenticación Facial Anti-Deepfake</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 40px;
        max-width: 600px;
        width: 100%;
      }

      h1 {
        color: #333;
        margin-bottom: 10px;
        font-size: 28px;
      }

      .subtitle {
        color: #666;
        margin-bottom: 30px;
        font-size: 14px;
      }

      .video-container {
        position: relative;
        margin: 30px 0;
        border-radius: 12px;
        overflow: hidden;
        background: #000;
        aspect-ratio: 4 / 3;
      }

      video {
        width: 100%;
        height: 100%;
        display: block;
      }

      canvas {
        display: none;
      }

      .button-container {
        display: flex;
        gap: 10px;
        margin: 20px 0;
      }

      button {
        flex: 1;
        padding: 12px 24px;
        font-size: 16px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      button:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .result-container {
        margin-top: 30px;
        padding: 20px;
        background: #f5f5f5;
        border-radius: 8px;
        border-left: 4px solid #667eea;
        min-height: 100px;
      }

      pre {
        font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
        font-size: 13px;
        color: #333;
        white-space: pre-wrap;
        word-wrap: break-word;
      }

      .result-container.success {
        border-left-color: #48bb78;
        background: #f0fff4;
      }

      .result-container.error {
        border-left-color: #f56565;
        background: #fff5f5;
      }

      .result-container.loading {
        border-left-color: #ed8936;
        background: #fffaf0;
      }

      .status-message {
        text-align: center;
        color: #666;
        font-style: italic;
      }

      .info-box {
        background: #edf2f7;
        border-radius: 8px;
        padding: 15px;
        margin: 20px 0;
        border-left: 4px solid #4299e1;
        font-size: 13px;
        color: #2d3748;
      }

      .loading-spinner {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid #f3f3f3;
        border-top: 3px solid #667eea;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔐 Autenticación Facial</h1>
      <p class="subtitle">Sistema Anti-Deepfake basado en Detección de Vivacidad</p>

      <div class="video-container">
        <video id="video" autoplay playsinline></video>
      </div>
      <canvas id="canvas"></canvas>

      <div class="button-container">
        <button id="auth-btn">🎥 Autenticar</button>
      </div>

      <div class="info-box">
        ℹ️ Asegúrate de que tu cara esté completamente visible en la cámara para una mejor detección.
      </div>

      <div class="result-container">
        <pre id="result" class="status-message">Esperando autenticación...</pre>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
